<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgroClima - Sistema de alerta temprana</title>
  
  <!-- Enlaces a archivos externos opcionales (si decides separarlos) -->
  <link rel="stylesheet" href="css/estilo_index.css">
  <script src="javascript/script_index.js" defer></script>
</head>
<body>
  <!-- HERO PRINCIPAL -->
  <main class="hero-main">
    <img 
      src="imagenes/campo_inicio.png" 
      alt="" 
      class="hero-bg-img"
    />
    <div class="figma-overlay"></div>
    <div class="hero-content">
      <img 
        src="imagenes/logo_blanco.png" 
        alt="Logo AgroClima" 
        class="logo-img"
        onerror="this.src='imagenes/logo_blanco.jpg';" 
      />
      
      <h1 class="hero-title">AgroClima</h1>
      <p class="hero-subtitle">Sistema de Alerta Temprana de Heladas</p>
      <p class="hero-description">
        Configura tu cuenta y protege tu parcela. Monitorea el clima y recibe alertas en tiempo real.
      </p>
      <div class="btn-container">
        <a 
          href="AgroClima_inicio_sesión.html" 
          class="btn-login"
        >
          Iniciar Sesión en el sistema
        </a>
      </div>
    </div>
  </main>
</body>
</html>
